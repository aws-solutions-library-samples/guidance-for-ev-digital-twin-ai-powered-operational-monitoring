AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lambda Proxy for AgentCore Runtime Integration with Frontend'

Parameters:
  ProjectName:
    Type: String
    Default: ev-digital-twin
    Description: Name of the project
  
  AgentCoreRuntimeArn:
    Type: String
    Default: arn:aws:bedrock-agentcore:us-east-1:009296485814:runtime/vehicle_maintenance_agent-kH9hYvFcCD
    Description: ARN of the AgentCore Runtime

Resources:
  # Lambda Execution Role
  AgentCoreLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agentcore-lambda-proxy-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentCoreInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource: 
                  - !Ref AgentCoreRuntimeArn
                  - !Sub '${AgentCoreRuntimeArn}/runtime-endpoint/DEFAULT'
              - Effect: Allow
                Action:
                  - logs:FilterLogEvents
                Resource: arn:aws:logs:us-east-1:009296485814:log-group:/aws/bedrock-agentcore/runtimes/vehicle_maintenance_agent-kH9hYvFcCD-DEFAULT:*
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vehicle-appointment-slots'

  # Lambda Function
  AgentCoreLambdaProxy:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agentcore-proxy"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt AgentCoreLambdaRole.Arn
      Timeout: 900
      MemorySize: 2048
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !Ref AgentCoreRuntimeArn
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import re
          from datetime import datetime, timedelta
          from decimal import Decimal
          
          def decimal_default(obj):
              if isinstance(obj, Decimal):
                  return float(obj)
              raise TypeError
          
          bedrock_agentcore = boto3.client('bedrock-agentcore', region_name='us-east-1')
          logs_client = boto3.client('logs', region_name='us-east-1')
          dynamodb = boto3.resource('dynamodb', region_name='us-east-1')
          
          LOG_GROUP_NAME = '/aws/bedrock-agentcore/runtimes/vehicle_maintenance_agent-kH9hYvFcCD-DEFAULT'
          APPOINTMENTS_TABLE = 'vehicle-appointment-slots'
          
          def get_available_appointments(date):
              """Query DynamoDB for available appointment slots on a specific date"""
              table = dynamodb.Table(APPOINTMENTS_TABLE)
              
              try:
                  response = table.query(
                      KeyConditionExpression='#d = :date',
                      FilterExpression='available = :avail',
                      ExpressionAttributeNames={'#d': 'date'},
                      ExpressionAttributeValues={':date': date, ':avail': True}
                  )
                  
                  slots = response.get('Items', [])
                  return sorted(slots, key=lambda x: x['time_slot'])
              except Exception as e:
                  print(f"DynamoDB query error: {e}")
                  return []
          
          def lambda_handler(event, context):
              print(f"Event: {json.dumps(event)}")
              
              # Handle GET /available-appointments
              if event.get('requestContext', {}).get('http', {}).get('method') == 'GET':
                  query_params = event.get('queryStringParameters', {}) or {}
                  date = query_params.get('date')
                  
                  if not date:
                      return {
                          'statusCode': 400,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*',
                              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
                              'Access-Control-Allow-Methods': 'GET,POST,OPTIONS'
                          },
                          'body': json.dumps({'error': 'date parameter required (YYYY-MM-DD)'})
                      }
                  
                  slots = get_available_appointments(date)
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*',
                          'Access-Control-Allow-Headers': 'Content-Type,Authorization',
                          'Access-Control-Allow-Methods': 'GET,POST,OPTIONS'
                      },
                      'body': json.dumps({
                          'date': date,
                          'available_slots': slots,
                          'count': len(slots)
                      }, default=decimal_default)
                  }
              
              # Handle POST /chat (existing logic - unchanged)
              try:
                  body = json.loads(event.get('body', '{}'))
                  prompt = body.get('prompt', body.get('message', ''))
                  session_id = body.get('session_id')
                  
                  if not session_id or session_id == 'null':
                      import uuid
                      session_id = f"session-{uuid.uuid4()}"
                  
                  if not prompt:
                      return {
                          'statusCode': 400,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*',
                              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
                              'Access-Control-Allow-Methods': 'POST,OPTIONS'
                          },
                          'body': json.dumps({'error': 'prompt or message is required'})
                      }
                  
                  agent_arn = os.environ['AGENT_RUNTIME_ARN']
                  
                  print(f"Invoking AgentCore Runtime: {agent_arn}")
                  print(f"Session ID: {session_id}")
                  print(f"Prompt: {prompt}")
                  
                  is_tire_order = 'order_tire_online' in prompt.lower() or 'order replacement tires' in prompt.lower()
                  
                  payload_data = {"prompt": prompt}
                  
                  try:
                      response = bedrock_agentcore.invoke_agent_runtime(
                          agentRuntimeArn=agent_arn,
                          runtimeSessionId=session_id,
                          payload=json.dumps(payload_data)
                      )
                      
                      full_response = ""
                      
                      if 'response' in response:
                          streaming_body = response['response']
                          response_bytes = streaming_body.read()
                          
                          if isinstance(response_bytes, bytes):
                              full_response = response_bytes.decode('utf-8')
                          else:
                              full_response = str(response_bytes)
                          
                          try:
                              response_json = json.loads(full_response)
                              if isinstance(response_json, str):
                                  full_response = response_json
                          except:
                              pass
                      
                      print(f"Response length: {len(full_response)}")
                      
                      return {
                          'statusCode': 200,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': '*',
                              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
                              'Access-Control-Allow-Methods': 'POST,OPTIONS'
                          },
                          'body': json.dumps({
                              'response': full_response,
                              'session_id': session_id,
                              'agent': 'AgentCore Runtime',
                              'timestamp': datetime.now().isoformat()
                          })
                      }
                      
                  except Exception as runtime_error:
                      error_str = str(runtime_error)
                      print(f"AgentCore Runtime error: {error_str}")
                      
                      if '500' in error_str and is_tire_order:
                          print("Attempting to extract tire order result from CloudWatch...")
                          
                          try:
                              end_time = int(datetime.now().timestamp() * 1000)
                              start_time = int((datetime.now() - timedelta(minutes=2)).timestamp() * 1000)
                              
                              log_response = logs_client.filter_log_events(
                                  logGroupName=LOG_GROUP_NAME,
                                  startTime=start_time,
                                  endTime=end_time,
                                  filterPattern='"order_tire_online"'
                              )
                              
                              for event in reversed(log_response.get('events', [])):
                                  message = event.get('message', '')
                                  
                                  product_match = re.search(r'Product name:\s*([^,]+)', message)
                                  brand_match = re.search(r'Brand:\s*([^,]+)', message)
                                  price_match = re.search(r'Price:\s*\$?([\d.]+)', message)
                                  
                                  if product_match and brand_match and price_match:
                                      extracted_response = f"Product name: {product_match.group(1).strip()}, Brand: {brand_match.group(1).strip()}, Price: ${price_match.group(1).strip()}"
                                      
                                      print(f"Extracted from logs: {extracted_response}")
                                      
                                      return {
                                          'statusCode': 200,
                                          'headers': {
                                              'Content-Type': 'application/json',
                                              'Access-Control-Allow-Origin': '*',
                                              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
                                              'Access-Control-Allow-Methods': 'POST,OPTIONS'
                                          },
                                          'body': json.dumps({
                                              'response': extracted_response,
                                              'session_id': session_id,
                                              'agent': 'AgentCore Runtime',
                                              'timestamp': datetime.now().isoformat(),
                                              'extracted_from_logs': True
                                          })
                                      }
                              
                              print("No tire data found in CloudWatch logs")
                              
                          except Exception as log_error:
                              print(f"CloudWatch query error: {log_error}")
                      
                      raise runtime_error
                  
              except Exception as e:
                  print(f"Error: {str(e)}")
                  import traceback
                  traceback.print_exc()
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*',
                          'Access-Control-Allow-Headers': 'Content-Type,Authorization',
                          'Access-Control-Allow-Methods': 'POST,OPTIONS'
                      },
                      'body': json.dumps({'error': str(e)})
                  }

  # HTTP API Gateway
  AgentCoreHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-agentcore-http-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - 'https://dvm0illvncdsh.cloudfront.net'
          - 'http://localhost:3000'
        AllowMethods:
          - POST
          - OPTIONS
          - GET
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  # Lambda Integration
  AgentCoreLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AgentCoreHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AgentCoreLambdaProxy.Arn
      PayloadFormatVersion: '2.0'

  # Chat Route
  AgentCoreChatRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AgentCoreHttpApi
      RouteKey: 'POST /chat'
      Target: !Sub 'integrations/${AgentCoreLambdaIntegration}'
  
  # Available Appointments Route
  AgentCoreAppointmentsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AgentCoreHttpApi
      RouteKey: 'GET /available-appointments'
      Target: !Sub 'integrations/${AgentCoreLambdaIntegration}'

  # Default Stage
  AgentCoreHttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AgentCoreHttpApi
      StageName: '$default'
      AutoDeploy: true

  # Lambda Permission for API Gateway
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentCoreLambdaProxy
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AgentCoreHttpApi}/*/*'

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub 'https://${AgentCoreHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub "${ProjectName}-agentcore-http-api-endpoint"
  
  ChatEndpoint:
    Description: Chat endpoint URL for frontend
    Value: !Sub 'https://${AgentCoreHttpApi}.execute-api.${AWS::Region}.amazonaws.com/chat'
    Export:
      Name: !Sub "${ProjectName}-agentcore-chat-endpoint"
  
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AgentCoreLambdaProxy.Arn
    Export:
      Name: !Sub "${ProjectName}-agentcore-lambda-arn"
  
  TestCommand:
    Description: Test command
    Value: !Sub |
      curl -X POST https://${AgentCoreHttpApi}.execute-api.${AWS::Region}.amazonaws.com/chat \
        -H "Content-Type: application/json" \
        -d '{"prompt": "What is the tire condition for vehicle 1?"}'

