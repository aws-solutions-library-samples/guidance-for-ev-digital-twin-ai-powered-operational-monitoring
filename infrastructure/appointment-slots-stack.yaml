AWSTemplateFormatVersion: '2010-09-09'
Description: '(SO9702) Guidance for EV Digital Twin - DynamoDB table for vehicle appointment scheduling'

Parameters:
  ProjectName:
    Type: String
    Default: ev-digital-twin
    Description: Name of the project

Resources:
  AppointmentSlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vehicle-appointment-slots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: time_slot
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: time_slot
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  VehicleRecommendationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vehicle-genai-recs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vin
          AttributeType: S
      KeySchema:
        - AttributeName: vin
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  AppointmentSlotsTableName:
    Description: DynamoDB table name for appointment slots
    Value: !Ref AppointmentSlotsTable
    Export:
      Name: !Sub "${ProjectName}-appointment-slots-table-name"
  
  AppointmentSlotsTableArn:
    Description: DynamoDB table ARN for appointment slots
    Value: !GetAtt AppointmentSlotsTable.Arn
    Export:
      Name: !Sub "${ProjectName}-appointment-slots-table-arn"

  VehicleRecommendationsTableName:
    Description: DynamoDB table name for vehicle recommendations
    Value: !Ref VehicleRecommendationsTable
    Export:
      Name: !Sub "${ProjectName}-vehicle-recommendations-table-name"
  
  VehicleRecommendationsTableArn:
    Description: DynamoDB table ARN for vehicle recommendations
    Value: !GetAtt VehicleRecommendationsTable.Arn
    Export:
      Name: !Sub "${ProjectName}-vehicle-recommendations-table-arn"
