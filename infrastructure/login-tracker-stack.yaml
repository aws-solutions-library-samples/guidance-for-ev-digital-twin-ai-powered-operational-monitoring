AWSTemplateFormatVersion: '2010-09-09'
Description: 'EV Digital Twin - Login Tracker Stack (DynamoDB + Lambda + API Gateway)'

Parameters:
  ProjectName:
    Type: String
    Default: ev-digital-twin
    Description: Name of the project
  
  Environment:
    Type: String
    Default: demo
    Description: Environment name

Resources:
  # ============================================================================
  # DYNAMODB TABLE
  # ============================================================================
  
  LoginEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-login-events"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: loginId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: loginId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DateIndex
          KeySchema:
            - AttributeName: date
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-login-events"
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: login-tracker

  # ============================================================================
  # IAM ROLE FOR LAMBDA
  # ============================================================================

  LoginTrackerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-login-tracker-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt LoginEventsTable.Arn
                  - !Sub "${LoginEventsTable.Arn}/index/*"

  # ============================================================================
  # LAMBDA FUNCTION
  # ============================================================================

  LoginTrackerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-login-tracker"
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt LoginTrackerLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref LoginEventsTable
      Code:
        ZipFile: |
          import json
          import boto3
          import uuid
          from datetime import datetime, timezone
          import os
          
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])
          
          def lambda_handler(event, context):
              # Enable CORS
              headers = {
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Headers': 'Content-Type',
                  'Access-Control-Allow-Methods': 'GET, POST, OPTIONS'
              }
              
              try:
                  # Handle preflight OPTIONS request
                  if event['httpMethod'] == 'OPTIONS':
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': json.dumps({'message': 'CORS preflight'})
                      }
                  
                  # Handle POST /login - Record login event
                  if event['httpMethod'] == 'POST' and event['resource'] == '/login':
                      body = json.loads(event['body'])
                      username = body.get('username', 'unknown')
                      
                      # Create login event
                      now = datetime.now(timezone.utc)
                      login_event = {
                          'loginId': str(uuid.uuid4()),
                          'username': username,
                          'timestamp': now.isoformat(),
                          'date': now.strftime('%Y-%m-%d')
                      }
                      
                      # Store in DynamoDB
                      table.put_item(Item=login_event)
                      
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': json.dumps({
                              'message': 'Login recorded successfully',
                              'loginId': login_event['loginId']
                          })
                      }
                  
                  # Handle GET /stats - Get login statistics
                  elif event['httpMethod'] == 'GET' and event['resource'] == '/stats':
                      now = datetime.now(timezone.utc)
                      today = now.strftime('%Y-%m-%d')
                      
                      # Get today's logins
                      today_response = table.query(
                          IndexName='DateIndex',
                          KeyConditionExpression='#date = :date',
                          ExpressionAttributeNames={'#date': 'date'},
                          ExpressionAttributeValues={':date': today}
                      )
                      
                      today_logins = today_response['Items']
                      today_count = len(today_logins)
                      today_unique = len(set(item['username'] for item in today_logins))
                      
                      # Get all logins for total count
                      all_response = table.scan()
                      all_logins = all_response['Items']
                      total_count = len(all_logins)
                      total_unique = len(set(item['username'] for item in all_logins))
                      
                      # Calculate week and month counts (simplified)
                      week_count = 0
                      month_count = 0
                      week_unique = set()
                      month_unique = set()
                      
                      for item in all_logins:
                          item_date = datetime.fromisoformat(item['timestamp'].replace('Z', '+00:00'))
                          days_ago = (now - item_date).days
                          
                          if days_ago <= 7:
                              week_count += 1
                              week_unique.add(item['username'])
                          if days_ago <= 30:
                              month_count += 1
                              month_unique.add(item['username'])
                      
                      stats = {
                          'totalLogins': total_count,
                          'todayLogins': today_count,
                          'weekLogins': week_count,
                          'monthLogins': month_count,
                          'uniqueUsers': total_unique,
                          'todayUniqueUsers': today_unique,
                          'weekUniqueUsers': len(week_unique),
                          'monthUniqueUsers': len(month_unique),
                          'lastUpdated': now.isoformat()
                      }
                      
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': json.dumps(stats)
                      }
                  
                  else:
                      return {
                          'statusCode': 404,
                          'headers': headers,
                          'body': json.dumps({'error': 'Not found'})
                      }
                      
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': 'Internal server error'})
                  }
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-login-tracker"
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # API GATEWAY
  # ============================================================================

  LoginTrackerApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-login-tracker-api"
      Description: API for login tracking
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Login resource
  LoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LoginTrackerApi
      ParentId: !GetAtt LoginTrackerApi.RootResourceId
      PathPart: login

  # Stats resource
  StatsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LoginTrackerApi
      ParentId: !GetAtt LoginTrackerApi.RootResourceId
      PathPart: stats

  # POST /login method
  LoginPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LoginTrackerApi
      ResourceId: !Ref LoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginTrackerLambda.Arn}/invocations"

  # OPTIONS /login method (CORS)
  LoginOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LoginTrackerApi
      ResourceId: !Ref LoginResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginTrackerLambda.Arn}/invocations"

  # GET /stats method
  StatsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LoginTrackerApi
      ResourceId: !Ref StatsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginTrackerLambda.Arn}/invocations"

  # OPTIONS /stats method (CORS)
  StatsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LoginTrackerApi
      ResourceId: !Ref StatsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginTrackerLambda.Arn}/invocations"

  # Lambda permissions for API Gateway
  LoginTrackerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoginTrackerLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${LoginTrackerApi}/*/*"

  # API Gateway Deployment
  LoginTrackerApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - LoginPostMethod
      - LoginOptionsMethod
      - StatsGetMethod
      - StatsOptionsMethod
    Properties:
      RestApiId: !Ref LoginTrackerApi
      StageName: prod

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:
  LoginTrackerApiEndpoint:
    Description: Login Tracker API Gateway endpoint
    Value: !Sub "https://${LoginTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${ProjectName}-login-tracker-api-endpoint"

  DynamoDBTableName:
    Description: DynamoDB table name for login events
    Value: !Ref LoginEventsTable
    Export:
      Name: !Sub "${ProjectName}-login-events-table"

  LambdaFunctionName:
    Description: Lambda function name for login tracking
    Value: !Ref LoginTrackerLambda
    Export:
      Name: !Sub "${ProjectName}-login-tracker-lambda"