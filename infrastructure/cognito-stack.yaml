AWSTemplateFormatVersion: '2010-09-09'
Description: '(SO9702) Guidance for EV Digital Twin - Cognito Authentication Stack with optional SAML federation'

Parameters:
  ProjectName:
    Type: String
    Default: ev-digital-twin
    Description: Name of the project

  Environment:
    Type: String
    Default: demo
    Description: Environment name

  CallbackURL:
    Type: String
    Default: https://localhost:3000
    Description: OAuth callback URL (update with CloudFront domain after deployment)

  SAMLMetadataURL:
    Type: String
    Default: ''
    Description: >-
      Optional URL to your corporate SAML 2.0 identity provider metadata
      document (for example, https://idp.example.com/saml/metadata.xml).
      Leave empty to skip provisioning the SAML federation provider and use
      Cognito-only sign-in.

  IncludeLocalhostUrls:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to include localhost URLs in callback/logout URLs (for development)

Conditions:
  AddLocalhostUrls: !Equals [!Ref IncludeLocalhostUrls, 'true']
  HasSAMLProvider: !Not [!Equals [!Ref SAMLMetadataURL, '']]

Resources:
  # ============================================================================
  # COGNITO AUTHENTICATION
  # ============================================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-user-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: false
          Mutable: true
      MfaConfiguration: "OPTIONAL"
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: false
        DeviceOnlyRememberedOnUserPrompt: false
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

  # User Pool Domain for OAuth/SAML flows
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${ProjectName}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  # Optional Corporate SAML Identity Provider.
  # Created only when SAMLMetadataURL parameter is supplied. Bring your own
  # SAML 2.0 IdP (Okta, Ping, ADFS, Azure AD, etc.) by passing the metadata URL.
  CorporateSAMLProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasSAMLProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: CorporateSSO
      ProviderType: SAML
      ProviderDetails:
        MetadataURL: !Ref SAMLMetadataURL
        IDPSignout: "true"
      AttributeMapping:
        email: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"
        given_name: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname"
        family_name: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-web-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # CorporateSSO is added to the supported providers only when the
      # CorporateSAMLProvider resource is created. The conditional reference
      # below also serves as the implicit DependsOn for ordering.
      SupportedIdentityProviders: !If
        - HasSAMLProvider
        - - COGNITO
          - !Ref CorporateSAMLProvider
        - - COGNITO
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs: !If
        - AddLocalhostUrls
        - - !Ref CallbackURL
          - http://localhost:3000
          - http://localhost:3000/
        - - !Ref CallbackURL
      LogoutURLs: !If
        - AddLocalhostUrls
        - - !Ref CallbackURL
          - http://localhost:3000
          - http://localhost:3000/
        - - !Ref CallbackURL
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
        - given_name
        - family_name
        - email_verified
      WriteAttributes:
        - email
        - given_name
        - family_name

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${ProjectName}_identity_pool"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-authenticated-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              'ForAnyValue:StringLike':
                'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
        - PolicyName: AuthenticatedUserPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-sync:GetBulkPublishDetails
                  - cognito-sync:GetCognitoEvents
                  - cognito-sync:GetIdentityPoolConfiguration
                  - cognito-sync:ListDatasets
                  - cognito-sync:ListRecords
                  - cognito-sync:QueryRecords
                  - cognito-identity:GetId
                  - cognito-identity:GetCredentialsForIdentity
                  - cognito-identity:GetOpenIdToken
                Resource: !Sub "arn:aws:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/${IdentityPool}"

  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:
  UserPoolId:
    Description: ID of the Cognito User Pool
    Value: !Ref UserPool
    Export:
      Name: !Sub "${ProjectName}-user-pool-id"

  UserPoolClientId:
    Description: ID of the Cognito User Pool Client
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${ProjectName}-user-pool-client-id"

  IdentityPoolId:
    Description: ID of the Cognito Identity Pool
    Value: !Ref IdentityPool
    Export:
      Name: !Sub "${ProjectName}-identity-pool-id"

  UserPoolArn:
    Description: ARN of the Cognito User Pool
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${ProjectName}-user-pool-arn"

  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Sub "${ProjectName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${ProjectName}-user-pool-domain"

  CorporateSSOSignInURL:
    Condition: HasSAMLProvider
    Description: URL for corporate SSO federated sign-in (only emitted when a SAML metadata URL is configured)
    Value: !Sub "https://${ProjectName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize?identity_provider=CorporateSSO&redirect_uri=${CallbackURL}&response_type=code&client_id=${UserPoolClient}&scope=email+openid+profile"
    Export:
      Name: !Sub "${ProjectName}-corporate-sso-signin-url"
