version: '3.8'

services:
  tire-maintenance-system:
    build: .
    container_name: tire-maintenance-system
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
    stdin_open: true
    tty: true
    command: python cli_interface.py

  # Future: Web interface service
  web-interface:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tire-maintenance-web
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
    depends_on:
      - tire-maintenance-system
    profiles:
      - web

  # Future: Database service
  database:
    image: postgres:13
    container_name: tire-maintenance-db
    environment:
      POSTGRES_DB: tire_maintenance
      POSTGRES_USER: tire_user
      POSTGRES_PASSWORD: tire_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    profiles:
      - database

volumes:
  postgres_data: